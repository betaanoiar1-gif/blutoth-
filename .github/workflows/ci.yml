name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/BluetoothDoctor.Core.Tests/BluetoothDoctor.Core.Tests.csproj --configuration Release
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build BluetoothDoctorPro.sln --configuration Release
      - run: dotnet test tests/BluetoothDoctor.Core.Tests/BluetoothDoctor.Core.Tests.csproj --configuration Release
